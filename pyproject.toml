[project]
name = "time-tracker"
version = "0.1.0"
description = "Time tracker estilo Toggl: sesiones de trabajo, tareas e intervalos (Flet + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Flet 1.x separó la CLI del runtime: sin flet-cli, `flet.exe` intenta
    # autoinstalarse en el Python del sistema (evitado así).
    "flet==1.1.2",
    "flet-cli==1.1.2",
    "flet-desktop==1.1.2",
    "flet-charts==1.1.2",
]

# Metadatos que `flet build` (Fase 4) lee además de `project.name`/`version`:
# `product` es el nombre visible (título de ventana, menú Inicio); la versión
# mostrada (`--build-name`) sale automáticamente de `project.version` y
# `build_number` es el contador interno de compilaciones del runner.
# Icono: sin `assets/icon.png` el build usa el icono por defecto de Flet.
[tool.flet]
product = "Time Tracker"
build_number = 1

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
